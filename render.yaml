services:
  - type: web
    name: skillswap
    runtime: node
    rootDir: backend
    buildCommand: npm install && cd ../frontend && npm install && npm run build && cd ../backend
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
